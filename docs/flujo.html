<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa del flujo</title>
<style>
  :root {
    --bg: #f4f6fa; --ink: #172033; --muted: #5d6779; --line: #9aa5b8;
    --admin: #2557d6; --admin-bg: #e8eefc;
    --mgr: #c0359a; --mgr-bg: #fbe9f5;
    --col: #6b3fd0; --col-bg: #efe9fc;
    --sys: #4a5568; --sys-bg: #eceff4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141c; --ink: #e7ebf3; --muted: #9aa4b6; --line: #5b6578;
      --admin: #7ea2ff; --admin-bg: #1c2a4a; --mgr: #f08ad2; --mgr-bg: #3a1d33;
      --col: #b49aff; --col-bg: #2a2147; --sys: #b5bfd0; --sys-bg: #252d3b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141c; --ink: #e7ebf3; --muted: #9aa4b6; --line: #5b6578;
    --admin: #7ea2ff; --admin-bg: #1c2a4a; --mgr: #f08ad2; --mgr-bg: #3a1d33;
    --col: #b49aff; --col-bg: #2a2147; --sys: #b5bfd0; --sys-bg: #252d3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 10px; font-size: 24px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .role { padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .scroll { overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 960px; height: auto; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
  .edge.dash { stroke-dasharray: 6 5; }
  .arrow { fill: var(--line); }
  .elabel { fill: var(--muted); font-size: 12px; font-style: italic; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 700; }
  .d { fill: var(--muted); font-size: 12px; }
  .zone { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
</style>
</head>
<body>
<main>
  <h1>Mapa del flujo · Inducción y micro aprendizaje</h1>
  <div class="legend" id="legend"></div>
  <div class="scroll"><svg id="map" viewBox="0 0 1300 800" role="img" aria-label="Mapa conceptual del flujo de la plataforma"></svg></div>
</main>
<script>
  const ROLES = {
    admin: ['Administrador', 'var(--admin)', 'var(--admin-bg)'],
    mgr:   ['Manager',       'var(--mgr)',   'var(--mgr-bg)'],
    col:   ['Colaborador',   'var(--col)',   'var(--col-bg)'],
    sys:   ['Sistema',       'var(--sys)',   'var(--sys-bg)']
  };

  // Nodos: título de la acción + descripción breve (máx. 2 líneas)
  const N = {
    registro:  { x: 215,  y: 90,  r: 'admin', t: 'Registro',            d: ['Alta del colaborador', 'con correo @jala.global'] },
    validar:   { x: 215,  y: 220, r: 'mgr',   t: 'Validación',          d: ['Revisa la ruta y ajusta', 'documentos de Etapa 3'] },
    lectura:   { x: 215,  y: 350, r: 'col',   t: 'Lectura',             d: ['Lee cada documento', 'de su ruta'] },
    examen:    { x: 215,  y: 480, r: 'col',   t: 'Examen',              d: ['5 preguntas por documento', 'mínimo 80 %'] },
    cerrada:   { x: 215,  y: 610, r: 'sys',   t: 'Inducción cerrada',   d: ['Aprobó todos', 'sus documentos'] },
    ascenso:   { x: 215,  y: 740, r: 'admin', t: 'Ascenso',             d: ['Lo asciende a Manager', 'si cumple el requisito'] },

    hub:       { x: 825,  y: 90,  r: 'admin', t: 'El Admin inicia',     d: ['En cualquier momento,', 'para colaboradores activos'], rx: 130 },

    campana:   { x: 510,  y: 220, r: 'admin', t: 'Campaña',             d: ['Diaria, semanal o quincenal', 'y cuántos envíos'] },
    envio:     { x: 510,  y: 350, r: 'sys',   t: 'Envío',               d: ['Llega la microevaluación', '2 días para responder'] },
    responde:  { x: 510,  y: 480, r: 'col',   t: 'Responde',            d: ['Respondidas', 'de recibidas'] },
    reenvio:   { x: 510,  y: 610, r: 'mgr',   t: 'Reenvío',             d: ['Si venció, la pide', 'y Manager o Admin reenvía'] },

    actualiza: { x: 825,  y: 220, r: 'admin', t: 'Actualiza documento', d: ['Nueva versión y preguntas', 'editables por el Admin'] },
    fuerte:    { x: 727,  y: 350, r: 'admin', t: 'Cambio fuerte',       d: ['Se archiva el avance', 'anterior'], rx: 90 },
    menor:     { x: 923,  y: 350, r: 'admin', t: 'Cambio menor',        d: ['Solo aviso o', 'releer + examen'], rx: 90 },
    releer:    { x: 825,  y: 480, r: 'col',   t: 'Relee y rinde',       d: ['Microevaluación del', 'documento actualizado'] },
    aviso:     { x: 825,  y: 610, r: 'mgr',   t: 'Aviso al Manager',    d: ['Solo se entera,', 'no rinde nada'] },

    publica:   { x: 1150, y: 220, r: 'admin', t: 'Publica documento',   d: ['Nuevo en el', 'repositorio'] },
    suma:      { x: 1150, y: 350, r: 'col',   t: 'Entra a su ruta',     d: ['Lo lee y rinde', 'su examen'] },
    retira:    { x: 1150, y: 480, r: 'admin', t: 'Retira documento',    d: ['Sale de rutas', 'y campañas'] },
    recalcula: { x: 1150, y: 610, r: 'sys',   t: 'Recalcula avance',    d: ['Y avisa a los', 'afectados'] }
  };

  // Conexiones: [desde, hasta, etiqueta, opciones]
  const E = [
    ['registro', 'validar'], ['validar', 'lectura', 'activo'], ['lectura', 'examen'],
    ['examen', 'lectura', 'reprobó: reintenta', { curve: -60 }],
    ['examen', 'cerrada', 'aprobó todos'], ['cerrada', 'ascenso'],
    ['validar', 'hub', 'colaborador activo', { dash: true }],
    ['hub', 'campana'], ['hub', 'actualiza'], ['hub', 'publica'], ['hub', 'retira', '', { via: [1285, 90] }],
    ['campana', 'envio'], ['envio', 'responde'], ['responde', 'reenvio', 'venció'],
    ['reenvio', 'responde', '', { curve: 55 }],
    ['actualiza', 'fuerte'], ['actualiza', 'menor'], ['fuerte', 'releer'], ['menor', 'releer', 'si pide examen'],
    ['releer', 'aviso', 'y además'],
    ['publica', 'suma'], ['retira', 'recalcula']
  ];

  const svg = document.getElementById('map');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
    if (text) e.textContent = text;
    svg.appendChild(e); return e;
  };
  const RX = 110, RY = 46;
  const rx = n => n.rx || RX;
  // Punto del borde del óvalo en dirección a (tx, ty)
  const borde = (n, tx, ty) => {
    const dx = tx - n.x, dy = ty - n.y;
    const k = 1 / Math.sqrt((dx / rx(n)) ** 2 + (dy / RY) ** 2);
    return [n.x + dx * k, n.y + dy * k];
  };

  el('defs', {}).innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>';

  // Zonas
  el('text', { x: 40, y: 30, class: 'zone' }, 'FASES 1 Y 2 · REGISTRO E INDUCCIÓN');
  el('text', { x: 400, y: 30, class: 'zone' }, 'FASE 3 · MICRO APRENDIZAJE Y ACTUALIZACIÓN DE DOCUMENTOS');
  el('line', { x1: 365, y1: 20, x2: 365, y2: 790, stroke: 'var(--line)', 'stroke-dasharray': '2 6' });
  el('text', { x: 510, y: 690, class: 'zone', 'text-anchor': 'middle' }, 'A · CAMPAÑA');
  el('text', { x: 825, y: 690, class: 'zone', 'text-anchor': 'middle' }, 'B · ACTUALIZACIÓN');
  el('text', { x: 1150, y: 690, class: 'zone', 'text-anchor': 'middle' }, 'C · PUBLICAR / RETIRAR');

  // Conexiones
  E.forEach(([a, b, label, o = {}]) => {
    const A = N[a], B = N[b];
    let d, lx, ly;
    if (o.curve) {
      const side = Math.sign(o.curve);
      const p1 = [A.x + side * rx(A), A.y], p2 = [B.x + side * rx(B), B.y];
      const cx = A.x + o.curve + side * rx(A);
      d = `M${p1} C${cx},${A.y} ${cx},${B.y} ${p2}`;
      // La curva llega casi al borde: la etiqueta va del lado interior, entre los óvalos
      lx = side < 0 ? cx + 34 : cx + 8; ly = (A.y + B.y) / 2 + 4;
    } else if (o.via) {
      const p1 = borde(A, o.via[0], o.via[1]);
      d = `M${p1} L${o.via} L${o.via[0]},${B.y} L${o.via[0] > B.x ? B.x + rx(B) : B.x - rx(B)},${B.y}`;
    } else {
      const p1 = borde(A, B.x, B.y), p2 = borde(B, A.x, A.y);
      d = `M${p1} L${p2}`;
      lx = (p1[0] + p2[0]) / 2 + 8; ly = (p1[1] + p2[1]) / 2 + 4;
    }
    el('path', { d, class: 'edge' + (o.dash ? ' dash' : ''), 'marker-end': 'url(#ah)' });
    if (label) el('text', { x: lx, y: ly, class: 'elabel' }, label);
  });

  // Óvalos
  Object.values(N).forEach(n => {
    const [, stroke, fill] = ROLES[n.r];
    el('ellipse', { cx: n.x, cy: n.y, rx: rx(n), ry: RY, fill, stroke, 'stroke-width': 2 });
    el('text', { x: n.x, y: n.y - 10, class: 't', 'text-anchor': 'middle' }, n.t);
    n.d.forEach((l, i) => el('text', { x: n.x, y: n.y + 8 + i * 15, class: 'd', 'text-anchor': 'middle' }, l));
  });

  document.getElementById('legend').innerHTML = Object.values(ROLES)
    .map(([n, c, b]) => `<span class="role" style="color:${c};background:${b};border:1.5px solid ${c}">${n}</span>`).join('');
</script>
</body>
</html>
